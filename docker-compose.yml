


services:
  qdrant:
    image: qdrant/qdrant
    container_name: telesale_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    networks:
      - telesale_network

  postgres:
    image: postgres:16-alpine
    container_name: telesale_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: Asia/Ho_Chi_Minh
    secrets:
      - postgres_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telesale_network

  redis:
    image: redis:7-alpine
    container_name: telesale_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - telesale_redis_data:/data
    networks:
      - telesale_network

  mcp-db-roles:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    secrets:
      - postgres_password
      - mcp_catalog_password
      - mcp_order_password
      - mcp_memory_password
    volumes:
      - ./ai-services/scripts/provision_mcp_roles.sh:/provision_mcp_roles.sh:ro
    entrypoint: ["sh", "/provision_mcp_roles.sh"]
    networks:
      - telesale_network

  mcp-catalog:
    build:
      context: ./ai-services
      args:
        INSTALL_RAG: ${POLICY_RAG_ENABLED:-false}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_catalog.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_catalog
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_catalog_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_CATALOG_PORT: ${MCP_CATALOG_PORT:-8011}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      POLICY_RAG_ENABLED: ${POLICY_RAG_ENABLED:-false}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    secrets:
      - mcp_catalog_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_CATALOG_PORT:-8011}:${MCP_CATALOG_PORT:-8011}"
    networks:
      - telesale_network

  mcp-order:
    build: ./ai-services
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_order.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_order
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_order_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_ORDER_PORT: ${MCP_ORDER_PORT:-8012}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
    secrets:
      - mcp_order_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_ORDER_PORT:-8012}:${MCP_ORDER_PORT:-8012}"
    networks:
      - telesale_network

  mcp-memory:
    build: ./ai-services
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_memory.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
      langmem-worker:
        condition: service_started
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_memory
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_memory_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_MEMORY_PORT: ${MCP_MEMORY_PORT:-8013}
      MEMORY_DB_POOL_MIN_SIZE: ${MEMORY_DB_POOL_MIN_SIZE:-1}
      MEMORY_DB_POOL_MAX_SIZE: ${MEMORY_DB_POOL_MAX_SIZE:-5}
      MEMORY_SUMMARY_TURNS: ${MEMORY_SUMMARY_TURNS:-3}
      MEMORY_SUMMARY_MAX_CHARS: ${MEMORY_SUMMARY_MAX_CHARS:-800}
      LANGMEM_MODE: ${LANGMEM_MODE:-enabled}
    secrets:
      - mcp_memory_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_MEMORY_PORT:-8013}:${MCP_MEMORY_PORT:-8013}"
    networks:
      - telesale_network

  langmem-worker:
    build: ./ai-services
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_memory.distiller_worker"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in ai-services/.env}
      LLM_MODEL: ${LLM_MODEL:-gemma4:31b}
      LANGMEM_MODEL: ${LANGMEM_MODEL:-}
      LANGMEM_MAX_TOKENS: ${LANGMEM_MAX_TOKENS:-1024}
      LANGMEM_MODE: ${LANGMEM_MODE:-enabled}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_memory
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_memory_password
    secrets:
      - mcp_memory_password
    networks:
      - telesale_network

networks:
  telesale_network:
    driver: bridge

volumes:
  telesale_redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  mcp_catalog_password:
    file: ./secrets/mcp_catalog_password
  mcp_order_password:
    file: ./secrets/mcp_order_password
  mcp_memory_password:
    file: ./secrets/mcp_memory_password
  mcp_internal_token:
    file: ./secrets/mcp_internal_token
