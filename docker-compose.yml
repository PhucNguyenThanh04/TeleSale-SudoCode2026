


services:
  qdrant:
    image: qdrant/qdrant
    container_name: telesale_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    networks:
      - telesale_network

  postgres:
    image: postgres:16-alpine
    container_name: telesale_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: Asia/Ho_Chi_Minh
    secrets:
      - postgres_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telesale_network

  redis:
    image: redis:7-alpine
    container_name: telesale_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - telesale_redis_data:/data
    networks:
      - telesale_network

networks:
  telesale_network:
    driver: bridge

volumes:
  telesale_redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
