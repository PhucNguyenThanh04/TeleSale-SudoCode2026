


services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: telesale_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    networks:
      - telesale_network

  postgres:
    image: postgres:16-alpine
    container_name: telesale_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: Asia/Ho_Chi_Minh
    secrets:
      - postgres_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telesale_network

  redis:
    image: redis:7-alpine
    container_name: telesale_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - telesale_redis_data:/data
    networks:
      - telesale_network

  mcp-db-roles:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    secrets:
      - postgres_password
      - mcp_catalog_password
      - mcp_order_password
      - mcp_memory_password
      - mcp_knowledge_password
    volumes:
      - ./ai-services/scripts/provision_mcp_roles.sh:/provision_mcp_roles.sh:ro
    entrypoint: ["sh", "/provision_mcp_roles.sh"]
    networks:
      - telesale_network

  mcp-catalog:
    build:
      context: ./ai-services
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_catalog.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_catalog
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_catalog_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_CATALOG_PORT: ${MCP_CATALOG_PORT:-8011}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
    secrets:
      - mcp_catalog_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_CATALOG_PORT:-8011}:${MCP_CATALOG_PORT:-8011}"
    networks:
      - telesale_network

  mcp-knowledge:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.knowledge
    restart: unless-stopped
    command: [python, -m, app.mcp_servers.mcp_knowledge.server]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_knowledge
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_knowledge_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_KNOWLEDGE_PORT: ${MCP_KNOWLEDGE_PORT:-8014}
      KNOWLEDGE_POLICY_CONFIG_FILE: /config/policy-runtime.json
      QDRANT_URL: http://qdrant:6333
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in ai-services/.env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in ai-services/.env}
    secrets:
      - mcp_knowledge_password
      - mcp_internal_token
    volumes:
      - type: bind
        source: ${KNOWLEDGE_POLICY_CONFIG_FILE:-./config/policy-runtime.json}
        target: /config/policy-runtime.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${MCP_KNOWLEDGE_PORT:-8014}:${MCP_KNOWLEDGE_PORT:-8014}"
    networks:
      - telesale_network

  mcp-order:
    build:
      context: ./ai-services
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_order.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_order
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_order_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_ORDER_PORT: ${MCP_ORDER_PORT:-8012}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
    secrets:
      - mcp_order_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_ORDER_PORT:-8012}:${MCP_ORDER_PORT:-8012}"
    networks:
      - telesale_network

  mcp-memory:
    build:
      context: ./ai-services
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_memory.server"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
      langmem-worker:
        condition: service_started
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: unused-for-mcp
      LLM_MODEL: unused-for-mcp
      MCP_HOST: 0.0.0.0
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_memory
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_memory_password
      MCP_INTERNAL_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_MEMORY_PORT: ${MCP_MEMORY_PORT:-8013}
      MEMORY_DB_POOL_MIN_SIZE: ${MEMORY_DB_POOL_MIN_SIZE:-1}
      MEMORY_DB_POOL_MAX_SIZE: ${MEMORY_DB_POOL_MAX_SIZE:-5}
    secrets:
      - mcp_memory_password
      - mcp_internal_token
    ports:
      - "127.0.0.1:${MCP_MEMORY_PORT:-8013}:${MCP_MEMORY_PORT:-8013}"
    networks:
      - telesale_network

  langmem-worker:
    build:
      context: ./ai-services
      args:
        BASE_IMAGE: ${AI_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_servers.mcp_memory.distiller_worker"]
    depends_on:
      mcp-db-roles:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gemma4:31b}
      LANGMEM_MODEL: ${LANGMEM_MODEL:-}
      LANGMEM_MAX_TOKENS: ${LANGMEM_MAX_TOKENS:-1024}
      LANGFUSE_PROMPTS_ENABLED: ${LANGFUSE_PROMPTS_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      OLLAMA_BASE_URL: ${LANGMEM_OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      MCP_DB_HOST: postgres
      MCP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      MCP_DB_USER: mcp_memory
      MCP_DB_PASSWORD_FILE: /run/secrets/mcp_memory_password
    secrets:
      - mcp_memory_password
    networks:
      - telesale_network

networks:
  telesale_network:
    driver: bridge

volumes:
  telesale_redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  mcp_catalog_password:
    file: ./secrets/mcp_catalog_password
  mcp_order_password:
    file: ./secrets/mcp_order_password
  mcp_memory_password:
    file: ./secrets/mcp_memory_password
  mcp_knowledge_password:
    file: ./secrets/mcp_knowledge_password
  mcp_internal_token:
    file: ./secrets/mcp_internal_token
