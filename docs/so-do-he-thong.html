<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sơ đồ kiến trúc hệ thống · TeleSale SudoCode 2026</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #172843;
      background: #edf2f9;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      max-width: 1660px;
      margin: auto;
      padding: clamp(16px, 3vw, 40px);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-block-end: 20px;
    }

    .project {
      margin: 0 0 5px;
      color: #355683;
      font-size: .86rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.4vw, 2.7rem);
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    button {
      border: 1px solid #bdcbe0;
      border-radius: 8px;
      padding: 9px 13px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #f1f6ff; }
    :focus-visible { outline: 3px solid #2366c7; outline-offset: 3px; }

    .viewport {
      overflow: auto;
      border: 1px solid #ccd7e8;
      border-radius: 16px;
      background: #fbfcff radial-gradient(#dbe4f1 1px, transparent 1px) 0 0 / 18px 18px;
      box-shadow: 0 12px 36px #243d6410;
    }

    .hint {
      margin: 10px 0 0;
      color: #405671;
      font-size: .85rem;
    }

    @media (min-width: 1300px) {
      .hint { display: none; }
    }

    svg {
      width: 100%;
      min-width: 1200px;
      height: auto;
      display: block;
    }

    .harness { --ink: #285ea9; --edge: #4176ba; --line: #aac1e4; --tint: #eaf2ff; }
    .tools { --ink: #633db0; --edge: #7958be; --line: #c5b5e5; --tint: #f2edff; }
    .workers { --ink: #8b4d16; --edge: #a76730; --line: #dec0a0; --tint: #fff3e4; }
    .storage { --ink: #106859; --edge: #318778; --line: #9eccbf; --tint: #e9f8f3; }

    .zone {
      fill: var(--tint);
      fill-opacity: .73;
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
    }

    .zone-title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    .node rect, .node ellipse, .node path {
      fill: #fff;
      stroke: var(--line, #b5c6df);
      stroke-width: 1.6;
    }

    .node .key { fill: var(--tint, #eef4fe); stroke: var(--edge, #b5c6df); }
    .node .rim { fill: var(--tint); }
    .node text { fill: #425675; font-size: 13px; text-anchor: middle; }
    .node .name { fill: #182b49; font-size: 16px; font-weight: 750; }

    .routes path, .signals path {
      fill: none;
      stroke: var(--edge, #4677b6);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .routes path {
      stroke-width: 1.75;
      marker-end: url(#arrow);
    }

    .routes .both { marker-start: url(#arrow); }

    .signals { pointer-events: none; }

    .signals path {
      stroke: color-mix(in srgb, var(--edge, #4677b6) 76%, white);
      stroke-width: 3.4;
      stroke-dasharray: 6 35;
      animation: flow 1.45s linear infinite;
    }

    .signals .both { animation-direction: alternate; }
    .signals .workers { animation-delay: -.7s; }
    .signals .tools { animation-delay: -.45s; }
    .signals .storage { animation-delay: -1s; }

    @keyframes flow {
      from { stroke-dashoffset: 41; }
      to { stroke-dashoffset: 0; }
    }

    .paused .signals path { animation-play-state: paused; }

    @media (prefers-reduced-motion: reduce) {
      .signals { display: none; }
    }

    .edge-label {
      fill: #324c70;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }

    .edge-label-inline {
      paint-order: stroke;
      stroke: #fbfcff;
      stroke-width: 7;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

    <header>

        <h1>Sơ đồ kiến trúc hệ thống</h1>
      </div>
      <button type="button" hidden>Tạm dừng chuyển động</button>

    <p class="hint">Cuộn ngang để xem toàn bộ sơ đồ.</p>
  </main>

  <script>
    const viewport = document.querySelector('.viewport');
    const signals = document.querySelector('.signals');
    const motionButton = document.querySelector('button');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    for (const route of document.querySelectorAll('.routes path')) {
      signals.append(route.cloneNode());
    }

    function updateMotionControl() {
      const paused = viewport.classList.contains('paused');
      motionButton.hidden = reduceMotion.matches;
      motionButton.textContent = paused ? 'Tiếp tục chuyển động' : 'Tạm dừng chuyển động';
    }

    motionButton.addEventListener('click', () => {
      viewport.classList.toggle('paused');
      updateMotionControl();
    });
    reduceMotion.addEventListener('change', updateMotionControl);
    updateMotionControl();
  </script>
</body>
</html>
