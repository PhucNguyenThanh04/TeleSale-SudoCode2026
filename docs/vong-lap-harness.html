<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vòng lặp xử lý của Agent Harness · TeleSale SudoCode 2026</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #172843;
      background: #edf2f9;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      max-width: 1660px;
      margin: auto;
      padding: clamp(16px, 2.4vw, 40px);
    }

    .project {
      margin: 0 0 7px;
      color: #355683;
      font-size: .9rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.6rem, 3.1vw, 2.55rem);
      letter-spacing: -.025em;
      line-height: 1.15;
    }

    .viewport {
      overflow: auto;
      border: 1px solid #ccd7e8;
      border-radius: 10px;
      background: #fbfcff radial-gradient(#dbe4f1 1px, transparent 1px) 0 0 / 18px 18px;
    }

    .viewport:focus-visible { outline: 3px solid #2366c7; outline-offset: 3px; }

    .hint {
      margin: 10px 0 0;
      color: #405671;
      font-size: .85rem;
    }

    @media (min-width: 1280px) {
      .hint { display: none; }
    }

    svg { display: block; width: 100%; min-width: 1200px; height: auto; }

    .harness { --ink: #285ea9; --edge: #3871ba; --border: #a5bee7; --tint: #eaf2ff; }
    .tools { --ink: #633db0; --edge: #7958be; --border: #c5b5e5; --tint: #f2edff; }
    .repair { --ink: #8b4d16; --edge: #a76730; --border: #dec0a0; --tint: #fff3e4; }
    .delivery { --ink: #106859; --edge: #318778; --border: #9eccbf; --tint: #e9f8f3; }

    .zone {
      fill: var(--tint);
      fill-opacity: .74;
      stroke: var(--border);
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
    }

    .zone-title { fill: var(--ink); font-size: 14px; font-weight: 750; }

    .routes path {
      fill: none;
      stroke: var(--edge);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow);
    }

    .routes .return { stroke-dasharray: 8 8; }

    .node rect, .node path, .node ellipse {
      fill: #fff;
      stroke: var(--border);
      stroke-width: 1.6;
    }

    .node .key { fill: var(--tint); stroke: var(--edge); }
    .node text { fill: #425675; font-size: 13px; text-anchor: middle; }
    .node .name { fill: #182b49; font-size: 16px; font-weight: 750; }

    .label { fill: var(--ink); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .label-bg { fill: #fbfcff; }
  </style>
</head>
<body>
  <main>
    <p class="project">TeleSale SudoCode 2026</p>
    <h1>Vòng lặp xử lý của Agent Harness</h1>
