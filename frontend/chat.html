<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleSale · Trò chuyện</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/chat.js"></script>
</head>
<body>
  <header><a class="brand" href="/">tele<span>sale</span></a><a href="/">Gọi bằng giọng nói</a></header>
  <main>
    <section class="call-panel" aria-labelledby="title">
      <h1 id="title">Trò chuyện với trợ lý</h1>
      <p class="intro">Tư vấn sản phẩm và tiếp tục trao đổi từ những lần trước.</p>
      <div class="settings-grid">
        <label>Kênh<select id="channel"><option value="hotline">Hotline</option><option value="chat_fanpage">Fanpage</option><option value="zalo_oa">Zalo OA</option><option value="web_chat">Website</option></select></label>
        <label>Định danh kênh<input id="identity" required maxlength="200" autocomplete="off"></label>
        <label>Ngày nghiệp vụ<input id="scenario-date" type="date" required></label>
      </div>
      <div class="actions"><button id="connect" type="button">Bắt đầu phiên</button><button id="end" type="button" disabled>Kết thúc phiên</button></div>
      <p id="status" role="status" aria-live="polite">Nhập thông tin để bắt đầu.</p>
      <p id="error" class="error" role="alert" hidden></p>
      <form id="chat-form">
        <label for="text">Tin nhắn</label>
        <textarea id="text" required maxlength="8000" rows="4" disabled></textarea>
        <button id="send" type="submit" disabled>Gửi</button>
      </form>
    </section>
    <section class="conversation text-conversation" aria-labelledby="conversation-title">
      <h2 id="conversation-title">Nội dung trao đổi</h2>
      <div id="brief"></div>
      <details id="timeline-panel" class="memory-timeline" open>
        <summary>Lịch sử tương tác</summary>
        <p id="timeline-status" role="status" aria-live="polite">Bắt đầu phiên để xem lịch sử.</p>
        <ol id="timeline-items" aria-label="Các phiên tương tác đã lưu"></ol>
        <div class="actions">
          <button id="timeline-reload" type="button" disabled>Tải lại lịch sử</button>
          <button id="timeline-more" type="button" hidden>Xem thêm</button>
        </div>
      </details>
      <div id="messages" role="log" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
